name: LibreRead Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBREREAD_API_URL: ''
      LIBREREAD_DEVICE_TOKEN: ''
      LIBREREAD_KEYSTORE_PATH: /tmp/libreread.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing identity
        env:
          SIGNING_KEY: ${{ secrets.LIBREREAD_SIGNING_KEY_B64 }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'The retained signing identity is required.' >&2; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$LIBREREAD_KEYSTORE_PATH"
          chmod 600 "$LIBREREAD_KEYSTORE_PATH"
      - name: Build and run unit tests
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:assembleReleaseAndroidTest -Plibreread.testBuildType=release --no-daemon --max-workers=2 -Dorg.gradle.parallel=false
      - name: Verify production APK identity
        run: bash scripts/verify-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: LibreRead-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/signing-certificate.txt
            app/build/outputs/apk/release/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: LibreRead-Instrumentation
          path: app/build/outputs/apk/androidTest/release/*.apk

  android-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: LibreRead-Release
          path: /tmp/libreread-built-release
      - uses: actions/download-artifact@v4
        with:
          name: LibreRead-Instrumentation
          path: /tmp/libreread-built-release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the exact configurable release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: app/build/outputs/release-instrumentation/
          if-no-files-found: ignore

  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.parallel=false

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate instrumentation result parsing
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run backend tests when present
        run: |
          if [ -f backend/package.json ]; then
            npm test --prefix backend
          fi
